name: Deploy
on:
  push:
    branches: [main]
    paths: ['reports/**', '.github/workflows/deploy.yml']
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - run: |
          mkdir -p ./_site
          cp -r reports/*.html ./_site/ 2>/dev/null || true
          if [ ! -f ./_site/index.html ]; then echo '<!DOCTYPE html><html><head><meta charset="utf-8"><title>AI Trending</title></head><body><h1>暂无报告</h1></body></html>' > ./_site/index.html; fi
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./_site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
